{% if form.errors %}
<div class="alert alert-danger" role="alert">
  <p class="mb-1">Please correct the following errors:</p>
  <ul class="mb-0">
    {% for field in form %}
      {% for error in field.errors %}
      <li>{{ field.label }}: {{ error }}</li>
      {% endfor %}
    {% endfor %}
    {% for error in form.non_field_errors %}
    <li>{{ error }}</li>
    {% endfor %}
  </ul>
</div>
{% endif %}
