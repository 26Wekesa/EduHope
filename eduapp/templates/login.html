{% extends 'starter-page.html' %}

{% load static %}

{% block title %} Login Page {% endblock %}

{% block content %}

<div class="page-shell">

<div class="container" style="max-width:420px; margin:0 auto;">

    <div class="page-card p-4 p-md-5">

        <div style="text-align:center; margin-bottom:18px;">
            <span class="badge rounded-pill px-3 py-2 mb-3" style="background: #eaf8ff; color: #0d1b4b; font-weight: 700;">Admin Login</span>
            <h3 style="color:#0d1b4b; font-weight:700; font-size:22px; margin-bottom:6px;">Sign in to manage Bold Foundation data</h3>
        </div>

        <style>
          .login-form input {
            padding: 12px 18px !important;
            border-radius: 25px !important;
            background: #1a1a1a !important;
            color: white !important;
            border: 2px solid #333 !important;
            font-size: 13px !important;
            margin-bottom: 12px !important;
            width: 100% !important;
            box-sizing: border-box !important;
          }
          .login-form input::placeholder { color: #999 !important; }
          .login-form input:focus {
            background: #252525 !important;
            border-color: #0a1f44 !important;
            box-shadow: 0 0 0 3px rgba(10, 31, 68, 0.1) !important;
            outline: none !important;
          }
          .login-btn {
            width: 100%;
            background: #e91e8c;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 25px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 6px;
          }
          .login-btn:hover { background: #d11a7a; }
        </style>

        <form method="post" class="login-form">
            {% csrf_token %}

            <div style="margin-bottom:12px;">
                <i class="bi bi-person-fill" style="color:#0a1f44; margin-right:8px;"></i>
                <input type="text" name="username" placeholder="Username" required>
            </div>

            <div style="margin-bottom:18px;">
                <i class="bi bi-lock-fill" style="color:#0a1f44; margin-right:8px;"></i>
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit" class="login-btn">Login</button>

        </form>

        <div style="text-align:center; margin-top:14px; font-size:14px; color:#556;">
            <p style="margin:0;">Don't have an account? <a href="{% url 'register' %}" style="color:#0a1f44; font-weight:600;">Sign Up</a></p>
            <a href="#" style="color:#0a1f44; display:inline-block; margin-top:6px;">Forgot your password?</a>
        </div>

    </div>

</div>
{% endblock %}
