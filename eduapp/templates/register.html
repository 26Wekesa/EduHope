{% extends 'starter-page.html' %}
{% load static %}

{% block title %}Create Admin Account{% endblock %}

{% block content %}

<div class="page-shell">

    <div class="container" style="max-width:420px; margin:0 auto;">

        <div class="page-card p-4 p-md-5">

            {% for message in messages %}
            <div class="alert alert-success" style="padding:10px 12px; border-radius:8px;">{{ message }}</div>
            {% endfor %}

            <h3 style="text-align:center; color:#0d1b4b; font-weight:700; margin-bottom:12px;">Create an Admin Account</h3>

            <form method="post">
                {% csrf_token %}

                <div style="margin-bottom:12px;">
                    <label style="font-weight:600; color:#0a1f44; display:block; margin-bottom:6px;">Username</label>
                    <input type="text" name="username" placeholder="Enter username" style="width:100%; padding:12px; border:2px solid #e6edf7; border-radius:8px;">
                </div>

                <div style="margin-bottom:12px;">
                    <label style="font-weight:600; color:#0a1f44; display:block; margin-bottom:6px;">Password</label>
                    <input name="password" type="password" placeholder="Enter password" style="width:100%; padding:12px; border:2px solid #e6edf7; border-radius:8px;">
                </div>

                <div style="margin-bottom:18px;">
                    <label style="font-weight:600; color:#0a1f44; display:block; margin-bottom:6px;">Confirm Password</label>
                    <input name="confirm_password" type="password" placeholder="Re-enter password" style="width:100%; padding:12px; border:2px solid #e6edf7; border-radius:8px;">
                </div>

                <button type="submit" class="page-btn-primary">Sign Up</button>

            </form>

            <div style="text-align:center; margin-top:14px; color:#556;">
                <p style="margin:0;">Already have an account? <a href="{% url 'login' %}" style="color:#0a1f44; font-weight:600;">Sign In</a></p>
            </div>

        </div>

    </div>

</div>

{% endblock %}
