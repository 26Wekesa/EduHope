{% extends 'starter-page.html' %}
{% load static %}

{% block title %}Create Admin Account{% endblock %}

{% block content %}

<div class="page-shell">

    <div class="container" style="max-width:420px; margin:0 auto;">

        <div class="page-card p-4 p-md-5">

            {% for message in messages %}
            <div class="alert alert-success" style="padding:10px 12px; border-radius:8px;">{{ message }}</div>
            {% endfor %}

            <h3 style="text-align:center; color:#0d1b4b; font-weight:700; margin-bottom:12px;">Create an Admin Account</h3>

            <style>
              .signup-form input {
                padding: 12px 18px !important;
                border-radius: 25px !important;
                background: #1a1a1a !important;
                color: white !important;
                border: 2px solid #333 !important;
                font-size: 13px !important;
                margin-bottom: 12px !important;
                width: 100% !important;
                box-sizing: border-box !important;
              }
              .signup-form input::placeholder { color: #999 !important; }
              .signup-form input:focus {
                background: #252525 !important;
                border-color: #0a1f44 !important;
                box-shadow: 0 0 0 3px rgba(10, 31, 68, 0.1) !important;
                outline: none !important;
              }
              .signup-btn {
                width: 100%;
                background: #e91e8c;
                color: white;
                padding: 12px;
                border: none;
                border-radius: 25px;
                font-weight: 700;
                cursor: pointer;
                transition: 0.3s;
                margin-top: 6px;
              }
              .signup-btn:hover { background: #d11a7a; }
            </style>

            <form method="post" class="signup-form">
                {% csrf_token %}

                <div style="margin-bottom:12px;">
                    <i class="bi bi-person-fill" style="color:#0a1f44; margin-right:8px;"></i>
                    <input type="text" name="username" placeholder="Username" required>
                </div>

                <div style="margin-bottom:12px;">
                    <i class="bi bi-lock-fill" style="color:#0a1f44; margin-right:8px;"></i>
                    <input name="password" type="password" placeholder="Password" required>
                </div>

                <div style="margin-bottom:18px;">
                    <i class="bi bi-lock-check" style="color:#0a1f44; margin-right:8px;"></i>
                    <input name="confirm_password" type="password" placeholder="Confirm Password" required>
                </div>

                <button type="submit" class="signup-btn">Sign Up</button>

            </form>

            <div style="text-align:center; margin-top:14px; color:#556;">
                <p style="margin:0;">Already have an account? <a href="{% url 'login' %}" style="color:#0a1f44; font-weight:600;">Sign In</a></p>
            </div>

        </div>

    </div>

</div>

{% endblock %}
