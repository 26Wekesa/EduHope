services:
  - type: web
    name: bold-foundation-staging
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn Edulink.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: eduhope-db
          property: connectionString
      - key: MPESA_ENVIRONMENT
        value: sandbox
      - key: MPESA_TRANSACTION_TYPE
        value: CustomerPayBillOnline

databases:
  - name: eduhope-db
    databaseName: eduhope
    user: eduhope
    plan: free
    region: oregon
