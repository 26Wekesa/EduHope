apiVersion: v1
kind: ConfigMap
metadata:
  name: eduhope-config
  namespace: eduhope
data:
  DEBUG: "False"
  DATABASE_SSL_REQUIRE: "False"
  ALLOWED_HOSTS: "localhost,127.0.0.1,eduhope-web"
  CSRF_TRUSTED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
  POSTGRES_DB: "eduhope"
  POSTGRES_USER: "eduhope"
  MPESA_ENVIRONMENT: "sandbox"
  MPESA_TRANSACTION_TYPE: "CustomerPayBillOnline"
